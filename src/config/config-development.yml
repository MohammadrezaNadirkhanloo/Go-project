Server:
  Port: 5005
  RunMode: debug
logger:
  filePath: ../logs/logs.log
  Encoding: json
  level: debug
  logger: zap
cors:
  allowOrgins: "*"
postgres:
  host: localhost
  port: 5432
  user: postgres
  password: admin
  dbName: car_sale_db
  sslMode: disable
  maxIdleConns: 15
  maxOpenConns: 100
  connMaxLifetime: 5
redis:
  host: localhost
  port: 6379
  password: password
  db: 0
  readTimeout: 5
  writeTimeout: 5
  dialTimeout: 5
  idleCheckFrequency: 500
  poolSize: 5000
  poolTimeout: 240
password:
  includeChars: true
  includeDigits: true
  minLength: 8
  maxlength: 15
  includeUppercase: true
  includeLowercase: true
otp:
  expireTime: 120
  digits: 6
  limiter: 100